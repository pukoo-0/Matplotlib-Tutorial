<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Matplotlib from Zero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #EAF0F3;
  --surface: #FFFFFF;
  --ink: #18263A;
  --muted: #5B6B7E;
  --line: #C9D5DE;
  --accent: #2F7D5B;
  --accent-ink: #FFFFFF;
  --accent-soft: #DCEFE5;
  --error: #B4412E;
  --error-soft: #F7E1DC;
  --code-bg: #F4F7F9;
  --out-bg: #18263A;
  --out-ink: #E3EAF0;
  --grid: rgba(24, 38, 58, 0.05);
  --sans: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0F1720; --surface: #16212C; --ink: #E3EAF0; --muted: #93A3B3; --line: #2A3947;
    --accent: #5FC497; --accent-ink: #0B1B13; --accent-soft: #183A2C; --error: #F08A74; --error-soft: #3A1F1A;
    --code-bg: #0E1821; --out-bg: #070D13; --out-ink: #CFE0D7; --grid: rgba(227, 234, 240, 0.04);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0F1720; --surface: #16212C; --ink: #E3EAF0; --muted: #93A3B3; --line: #2A3947;
  --accent: #5FC497; --accent-ink: #0B1B13; --accent-soft: #183A2C; --error: #F08A74; --error-soft: #3A1F1A;
  --code-bg: #0E1821; --out-bg: #070D13; --out-ink: #CFE0D7; --grid: rgba(227, 234, 240, 0.04);
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0; font-family: var(--sans); font-size: 17px; line-height: 1.55; color: var(--ink);
  background-color: var(--paper);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
code, pre, textarea { font-family: var(--mono); }

.app { display: grid; grid-template-columns: 280px minmax(0, 1fr); max-width: 1240px; margin: 0 auto; }

.side {
  position: sticky; top: env(safe-area-inset-top, 0px); align-self: start;
  height: calc(100vh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
  overflow-y: auto; padding: 28px 20px 24px; border-right: 1px solid var(--line);
  background: color-mix(in srgb, var(--paper) 85%, transparent);
}
.brand { font-weight: 700; font-size: 1.2rem; margin: 0 0 2px; }
.brand-sub { color: var(--muted); font-size: 0.9rem; margin: 0 0 20px; }
.progress { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; margin-bottom: 22px; }
.progress-label { font-size: 0.85rem; color: var(--muted); }
.progress-num { font-family: var(--mono); font-size: 2rem; font-weight: 600; line-height: 1.15; }
.bar { height: 8px; border-radius: 4px; background: var(--code-bg); border: 1px solid var(--line); overflow: hidden; margin: 8px 0 6px; }
.bar > div { height: 100%; background: var(--accent); width: 0; transition: width .4s ease; }
.progress-note { font-size: 0.85rem; color: var(--muted); }
.modlist { list-style: none; padding: 0; margin: 0; }
.mod-btn { width: 100%; text-align: left; background: none; border: 0; border-radius: 8px; padding: 8px 10px; display: grid; grid-template-columns: 26px 1fr auto; align-items: center; gap: 6px; }
.mod-btn:hover { background: var(--surface); }
.mod-btn[aria-current="true"] { background: var(--surface); box-shadow: inset 3px 0 0 var(--accent); font-weight: 700; }
.mod-n { font-family: var(--mono); font-size: 0.8rem; color: var(--muted); }
.mod-count { font-family: var(--mono); font-size: 0.78rem; color: var(--muted); }
.mod-count.full { color: var(--accent); font-weight: 600; }
.engine { margin-top: 20px; font-size: 0.82rem; color: var(--muted); display: flex; gap: 8px; align-items: center; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: #C9A227; flex: none; }
.dot.ok { background: var(--accent); }
.dot.bad { background: var(--error); }
.reset { margin-top: 14px; background: none; border: 0; padding: 0; color: var(--muted); font-size: 0.82rem; text-decoration: underline; }

main { padding: 32px 40px 80px; min-width: 0; }
.lesson-head h1 { font-size: 2rem; line-height: 1.15; margin: 0 0 6px; letter-spacing: -0.01em; }
.lesson-head p { margin: 0; color: var(--muted); max-width: 62ch; }

.learn { margin: 22px 0 26px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.learn > summary { cursor: pointer; padding: 14px 18px; font-weight: 700; list-style: none; display: flex; justify-content: space-between; gap: 10px; }
.learn > summary::-webkit-details-marker { display: none; }
.learn > summary::after { content: "Show"; font-weight: 400; font-size: 0.85rem; color: var(--muted); text-decoration: underline; }
.learn[open] > summary::after { content: "Hide"; }
.learn-body { padding: 4px 18px 18px; }
.block { padding: 14px 0; border-top: 1px solid var(--line); max-width: 72ch; }
.block:first-child { border-top: 0; padding-top: 4px; }
.block-step { font-family: var(--mono); font-size: 0.8rem; color: var(--muted); margin-bottom: 2px; }
.block p { margin: 0 0 8px; }
.block p:last-child { margin-bottom: 0; }
.sample { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; margin: 10px 0 6px; font-size: 14px; }
.sample pre { margin: 0; padding: 10px 12px; white-space: pre; overflow-x: auto; }
.sample .s-code { background: var(--code-bg); }
.sample .s-out { background: var(--out-bg); color: var(--out-ink); }
.sample .s-tag { display: block; font-family: var(--sans); font-size: 0.72rem; opacity: 0.7; margin-bottom: 4px; }
.sample.solo, .sample.stack { grid-template-columns: 1fr; }
.s-img { background: #FFFFFF; padding: 10px 12px; color: #18263A; }
.s-img img, .plots img { display: block; max-width: 100%; height: auto; }
.plots { background: #FFFFFF; }
.plots:empty { display: none; }
.plots img { padding: 10px 14px; }
code.i { background: var(--code-bg); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; font-size: 0.88em; white-space: nowrap; }
.tip { background: var(--accent-soft); border-radius: 8px; padding: 8px 12px; font-size: 0.95rem; }
.try-head { margin: 18px 0 8px; font-weight: 700; }

.ex-nav { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.steps { display: flex; gap: 6px; }
.step { width: 34px; height: 34px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--surface); font-family: var(--mono); font-size: 0.85rem; display: grid; place-items: center; }
.step[aria-current="true"] { border-color: var(--ink); border-width: 2px; }
.step.done { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.ex-title { font-size: 1.3rem; margin: 0; }

.task { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; margin-bottom: 14px; max-width: 78ch; }
.task p { margin: 0 0 8px; }
.task p:last-child { margin-bottom: 0; }

.editor-wrap { border: 1.5px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--code-bg); }
.editor-wrap:focus-within { border-color: var(--accent); }
.editor-bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 6px 12px; font-size: 0.8rem; color: var(--muted); border-bottom: 1px solid var(--line); }
textarea.code { display: block; width: 100%; min-height: 160px; resize: vertical; border: 0; outline: none; padding: 14px 16px; background: transparent; color: var(--ink); font-size: 15px; line-height: 1.55; tab-size: 4; white-space: pre; overflow-x: auto; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
.btn { border-radius: 8px; padding: 9px 16px; border: 1.5px solid var(--line); background: var(--surface); font-weight: 700; font-size: 0.95rem; }
.btn:hover { border-color: var(--ink); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { background: none; border-color: transparent; font-weight: 400; text-decoration: underline; padding-left: 6px; padding-right: 6px; }
.btn:disabled { opacity: 0.5; cursor: default; }

.console { border-radius: 12px; border: 1px solid var(--line); background: var(--surface); overflow: hidden; }
.console-head { padding: 8px 14px; font-size: 0.85rem; font-weight: 700; border-bottom: 1px solid var(--line); }
.console pre { margin: 0; padding: 12px 14px; font-size: 14px; white-space: pre-wrap; word-break: break-word; min-height: 48px; max-height: 320px; overflow: auto; }
.console.pass { border-color: var(--accent); }
.console.pass .console-head { background: var(--accent-soft); }
.console.fail .console-head { background: var(--error-soft); }
.verdict { padding: 10px 14px; border-top: 1px solid var(--line); font-size: 0.95rem; }
.verdict.pass { color: var(--accent); font-weight: 700; }
.verdict.fail { color: var(--error); }
.err-line { color: var(--error); }

.helper { margin-top: 14px; padding: 14px 16px; border-radius: 12px; background: var(--surface); border: 1px dashed var(--line); max-width: 78ch; }
.helper h3 { font-size: 0.95rem; margin: 0 0 6px; }
.helper p { margin: 0; }
.helper pre { background: var(--code-bg); padding: 10px 12px; border-radius: 8px; overflow-x: auto; font-size: 14px; margin: 8px 0 0; }

.next-row { display: flex; justify-content: space-between; margin-top: 22px; gap: 10px; }
.finish { background: var(--accent-soft); border-radius: 12px; padding: 18px 20px; margin-top: 22px; max-width: 78ch; }
.finish h2 { margin: 0 0 6px; font-size: 1.2rem; }
.finish p { margin: 0; }

@media (max-width: 860px) {
  .app { grid-template-columns: 1fr; }
  .side { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--line); padding: 18px 16px 12px; }
  .progress { padding: 10px 12px; margin-bottom: 12px; }
  .progress-num { font-size: 1.5rem; }
  .modlist { display: flex; overflow-x: auto; gap: 4px; padding-bottom: 6px; }
  .mod-btn { white-space: nowrap; grid-template-columns: auto auto auto; }
  .mod-btn[aria-current="true"] { box-shadow: inset 0 -3px 0 var(--accent); }
  main { padding: 22px 16px 60px; }
  .lesson-head h1 { font-size: 1.6rem; }
  .sample { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div class="app">
  <aside class="side" aria-label="Lessons">
    <p class="brand">Matplotlib from Zero</p>
    <p class="brand-sub">Learn to make charts by typing, one small step at a time. Know basic Python, NumPy and pandas first.</p>
    <div class="progress" aria-live="polite">
      <div class="progress-label">Progress</div>
      <div class="progress-num" id="pct">0%</div>
      <div class="bar"><div id="bar-fill"></div></div>
      <div class="progress-note" id="pct-note">0 exercises solved</div>
    </div>
    <ul class="modlist" id="modlist"></ul>
    <div class="engine"><span class="dot" id="engine-dot"></span><span id="engine-text">Starting Python and Matplotlib…</span></div>
    <button class="reset" id="reset">Reset all progress</button>
  </aside>
  <main id="main"></main>
</div>

hole numbers from 0 to 10 using <code class='i'>np.arange<\/code>. Calculate <code class='i'>y = x ** 2<\/code>, and plot y against x.<\/p>", "starter": "import numpy as np\nimport matplotlib.pyplot as plt\n", "hint": "x = np.arange(0, 11), y = x ** 2, then plt.plot(x, y) and plt.show()", "solution": "import numpy as np\nimport matplotlib.pyplot as plt\n\nx = np.arange(0, 11)\ny = x ** 2\nplt.plot(x, y)\nplt.show()", "check": "a = ax()\nlines = a.get_lines()\nexpect(len(lines) == 1, \"There should be exactly one line\")\nexpect(same(lines[0].get_xdata(), range(11)), \"x should be 0 to 10. Use np.arange(0, 11)\")\nexpect(same(lines[0].get_ydata(), [i * i for i in range(11)]), \"y should be x squared\")"}, {"id": "1c", "title": "Two cities", "task": "<p>Plot both cities’ temperatures on the <b>same<\/b> chart, with <code class='i'>months<\/code> on the x axis.<\/p>", "starter": "import matplotlib.pyplot as plt\n\nmonths = [1, 2, 3, 4, 5, 6]\nlisbon = [11, 12, 14, 16, 19, 22]\noslo = [-4, -4, 0, 5, 11, 15]\n", "hint": "Two plt.plot() calls before one plt.show()", "solution": "import matplotlib.pyplot as plt\n\nmonths = [1, 2, 3, 4, 5, 6]\nlisbon = [11, 12, 14, 16, 19, 22]\noslo = [-4, -4, 0, 5, 11, 15]\nplt.plot(months, lisbon)\nplt.plot(months, oslo)\nplt.show()", "check": "a = ax()\nlines = a.get_lines()\nexpect(len(lines) == 2, \"There should be two lines on the same chart\")\nys = sorted([list(l.get_ydata()) for l in lines])\nexpect(same(ys[0], oslo) and same(ys[1], lisbon), \"One line should be lisbon and one should be oslo, both against months\")"}]}, {"id": "g2", "title": "Titles, labels & legends", "blurb": "Make your chart explain itself.", "learn": [{"t": "<p>A chart without labels is a puzzle. Always tell the reader what they’re looking at:<\/p><p><code class='i'>plt.title()<\/code> adds a title at the top. <code class='i'>plt.xlabel()<\/code> and <code class='i'>plt.ylabel()<\/code> name the axes. Put them after your plot lines and before <code class='i'>pl \/code>, and the y label <code class='i'>Steps<\/code>.<\/p>", "starter": "import matplotlib.pyplot as plt\n\ndays = [1, 2, 3, 4, 5, 6, 7]\nsteps = [4200, 8100, 6500, 12000, 9800, 3000, 7600]\nplt.plot(days, steps)\n\nplt.show()", "hint": "plt.title(\"Daily steps\"), plt.xlabel(\"Day\"), plt.ylabel(\"Steps\"), all before plt.show()", "solution": "import matplotlib.pyplot as plt\n\ndays = [1, 2, 3, 4, 5, 6, 7]\nsteps = [4200, 8100, 6500, 12000, 9800, 3000, 7600]\nplt.plot(days, steps)\nplt.title(\"Daily steps\")\nplt.xlabel(\"Day\")\nplt.ylabel(\"Steps\")\nplt.show()", "check": "a = ax()\nexpect(a.get_title() == \"Daily steps\", \"The title should be: Daily steps\")\nexpect(a.get_xlabel() == \"Day\", \"The x label should be: Day\")\nexpect(a.get_ylabel() == \"Steps\", \"The y label should be: Steps\")"}, {"id": "2b", "title": "Which line is which?", "task": "<p>Give the lines the labels <code class='i'>Lisbon<\/code> and <code class='i'>Oslo<\/code>, and show a legend.<\/p>", "starter": "import matplotlib.pyplot as plt\n\nmonths = [1, 2, 3, 4, 5, 6]\nplt.plot(months, [11, 12, 14, 16, 19, 22])\nplt.plot(months, [-4, -4, 0, 5, 11, 15])\n\nplt.show()", "hint": "Add label=\"Lisbon\" inside the first plt.plot(), label=\"Oslo\" inside the second, then plt.legend()", "solution": "import matplotlib.pyplot as plt\n\nmonths = [1, 2, 3, 4, 5, 6]\nplt.plot(months, [11, 12, 14, 16, 19, 22], label=\"Lisbon\")\nplt.plot(months, [-4, -4, 0, 5, 11, 15], label=\"Oslo\")\nplt.legend()\nplt.show()", "check": "a = ax()\nlabels = sorted(l.get_label() for l in a.get_lines())\nexpect(labels == [\"Lisbon\", \"Oslo\"], \"Give the lines the labels Lisbon and Oslo using label=\")\nexpect(a.get_legend() is not None, \"Show the legend with plt.legend()\")"}, {"id": "2c", "title": "A bigger title", "task": "<p>Add the title <code class='i'>Monthly sales<\/code> with a font size of 16, and put the legend in the <code class='i'>upper left<\/code>.<\/p>", "starter": "import matplotlib.pyplot as plt\n\nplt.plot([1, 2, 3, 4], [20, 35, 30, 45], label=\"2025\")\nplt.plot([1, 2, 3, 4], [25, 30, 40, 50], label=\"2026\")\n\nplt.show()", "hint": "plt.title(\"Monthly sales\", fontsize=16) and plt.legend(loc=\"upper left\")", "solution": "import matplotlib.pyplot as plt\n\nplt.plot([1, 2, 3, 4], [20, 35, 30, 45], label=\"2025\")\nplt.plot([1, 2, 3, 4], [25, 30, 40, 50], label=\"2026\")\nplt.title(\"Monthly sales\", fontsize=16)\nplt.legend(loc=\"upper left\")\nplt.show()", "check": "a = ax()\nexpect(a.get_title() == \"Monthly sales\", \"The title should be: Monthly sales\")\nexpect(near(a.title.get_fontsize(), 16), \"Set the title size with fontsize=16\")\nexpect(a.get_legend() is not None, \"Show a legend\")\nexpect(\"upper left\" in __code__, \"Place the legend with loc=\\\"upper left\\\"\")"}]}, {"id": "g3", "title": "Styling lines", "blurb": "Change colours, line styles and markers.", "learn": [{"t": "<p>Choose a colour with <code class='i'>color=<\/code>. You can use names like <code class='i'>\"red\"<\/code>, <code class='i'>\"teal\"<\/code> or <code class='i'>\"orange\"<\/code>, or exact hex codes like <code class='i'>\"#2F7D5B\"<\/code>.<\/p>", "code": "import matplotlib.pyplot as plt\n\nplt.plot([1, 2, 3, 4], [1, 3, 2, 4], color=\"teal\")\nplt.plot([1, 2, 3, 4], [2, 1, 3, 2], color=\"#E07A5F\")\nplt.show()", "img": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAXMAAAD0CAYAAABpeMZGAAAAOnRFWHRTb2Z0d2FyZQBNYXRwbG90bGliIHZlcnNpb24zLjExLjIsIGh0dHBzOi8vbWF0cGxvdGxpYi5vcmcvgI3uAAAAAAlwSFlzAAALEwAACxMBAJqcGAAARPZJREFUeJzt3XdUVNfax/HvDL13BewVRcWGvWs0dulYo9GIPabeG1NNrmn33niNJSomxtgpgorYxa5RISr2jgWk984w5/0jiW8MKqjAmRn2Z62slck5c85vAvNwZj9n9lZIkiQhCIIgaDWl3AEEQRCElyeKuSAIgg4QxVwQBEEHiGIuCIKgA0QxFwRB0AGimAuCIOgAfTlOam9vT8OGDeU4tSAIgtaKi4sjNTX1idtkKeYNGzYkOjpajlMLgiBoLXd396duE8MsgiAIOkAUc0EQBB0girkgCIIOEMVcEARBB4hiLgiCoAMqXMyPHDlCmzZtSEtLK7Pt2LFj9OjRg06dOrF+/fpKDSgIgiCUr0K3JhYXF/P++++Tk5ODSqV6bFteXh6TJ09m79692NnZ0bt3bzp27EjLli2rJLAgCIK2ik1KormdHcb6lX9XeIWuzL/++mtee+01nJycymzb lotlib.pyplot as plt\n\nx = [1, 2, 3, 4, 5, 6]\ny = [3, 7, 5, 9, 8, 11]\nplt.plot(x, y, marker=\"o\")\nplt.grid(True)\nplt.show()", "check": "a = ax()\nexpect(a.get_lines()[0].get_marker() == \"o\", \"Use circle markers: marker=\\\"o\\\"\")\nexpect(any(g.get_visible() for g in a.xaxis.get_gridlines()), \"Turn on the grid with plt.grid(True)\")"}, {"id": "3c", "title": "An honest axis", "task": "<p>This chart makes a small change look dramatic. Make the y axis go from 0 to 100.<\/p>", "starter": "import matplotlib.pyplot as plt\n\nplt.plot([1, 2, 3, 4], [82, 84, 83, 86], marker=\"o\")\nplt.title(\"Customer satisfaction (%)\")\n\nplt.show()", "hint": "plt.ylim(0, 100)", "solution": "import matplotlib.pyplot as plt\n\nplt.plot([1, 2, 3, 4], [82, 84, 83, 86], marker=\"o\")\nplt.title(\"Customer satisfaction (%)\")\nplt.ylim(0, 100)\nplt.show()", "check": "lo, hi = ax().get_ylim()\nexpect(near(lo, 0) and near(hi, 100), \"The y axis should go from 0 to 100. Use plt.ylim(0, 100)\")"}]}, {"id": "g4", "title": "Bar charts", "blurb": "Compare amounts between categories.", "learn": [{"t": "<p>Use a <b>bar chart<\/b> to compare amounts between separate categories, like sales per product. <code class='i'>plt.bar(names, values)<\/code> draws one bar per name.<\/p>", "code": "import matplotlib.pyplot as plt\n\nfruits = [\"Apples\", \"Bananas\", \"Cherries\", \"Dates\"]\nsold = [30, 45, 12, 20]\nplt.bar(fruits, sold)\nplt.show()", "img": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAXAAAAD0CAYAAACCT31FAAAAOnRFWHRTb2Z0d2FyZQBNYXRwbG90bGliIHZlcnNpb24zLjExLjIsIGh0dHBzOi8vbWF0cGxvdGxpYi5vcmcvgI3uAAAAAAlwSFlzAAALEwAACxMBAJqcGAAAF1FJREFUeJzt3Xt0TXf+//FXhIii45KIGo3UMErFNXGtJiHFwlTcBnUpo43WzGJcWjqraGdZpYNpdY2pplozZTDVmOgSqrW009JxOdrQ0NSlQ0krwpJoyD3v3x/5OW0mvgS59FPPx397n73Pee8tntn2yQkfMzMBAJxTraoHAADcHAIOAI4i4ADgKAIOAI4i4ADgKAIOAI6qXpkvFhAQoJCQkMp8SQBw3okTJ3Tu3LlS6ys14CEhIfJ4PJX5kgDgvLCwsKuu5xYKADiKgAOAowg4ADiKgAOAowg4ADiKgAOAowg4ADiKgAOAoyr1gzyoOiFzEqt6hCp1YtHAqh4BKHdcgQOAowg4ADiKgAOAowg ts, owners)\nplt.show()", "check": "bars = ax().patches\nexpect(len(bars) == 4, \"There should be 4 bars. Use plt.bar(pets, owners)\")\nexpect(same([b.get_height() for b in bars], owners), \"The bar heights should be the owners numbers\")"}, {"id": "4b", "title": "Long names", "task": "<p>The names are long, so draw <b>horizontal<\/b> bars instead.<\/p>", "starter": "import matplotlib.pyplot as plt\n\nbooks = [\"The Very Long Novel\", \"A Short Guide to Everything\", \"Cooking for Busy People\"]\ncopies = [1200, 850, 2300]\n", "hint": "plt.barh(books, copies)", "solution": "import matplotlib.pyplot as plt\n\nbooks = [\"The Very Long Novel\", \"A Short Guide to Everything\", \"Cooking for Busy People\"]\ncopies = [1200, 850, 2300]\nplt.barh(books, copies)\nplt.show()", "check": "expect(\"barh\" in __code__, \"Use plt.barh for horizontal bars\")\nbars = ax().patches\nexpect(len(bars) == 3 and same([b.get_width() for b in bars], copies), \"There should be 3 horizontal bars with the copies numbers\")"}, {"id": "4c", "title": "Green bars with numbers", "task": "<p>Draw the bar chart in <code class='i'>green<\/code>, and write each value on its bar.<\/p>", "starter": "import matplotlib.pyplot as plt\n\ndays = [\"Mon\", \"Tue\", \"Wed\", \"Thu\", \"Fri\"]\norders = [14, 22, 18, 30, 26]\n", "hint": "bars = plt.bar(days, orders, color=\"green\"), then plt.bar_label(bars)", "solution": "import matplotlib.pyplot as plt\n\ndays = [\"Mon\", \"Tue\", \"Wed\", \"Thu\", \"Fri\"]\norders = [14, 22, 18, 30, 26]\nbars = plt.bar(days, orders, color=\"green\")\nplt.bar_label(bars)\nplt.show()", "check": "a = ax()\nexpect(len(a.patches) == 5, \"There should be 5 bars\")\nexpect(all(color_is(b.get_facecolor(), \"green\") for b in a.patches), \"Make the bars green: color=\\\"green\\\"\")\nexpect(len(a.texts) >= 5, \"Write the values on the bars with plt.bar_label(bars)\")"}]}, {"id": "g5", "title": "Scatter plots", "blurb": "See whether two things are related.", "learn": [{"t": "<p>A <b>sc UQlIMlcCCEqAUnmQghRCfx/9XoSnUqoAy4AAAAASUVORK5CYII="}], "playground": "import matplotlib.pyplot as plt\n\ntemp = [18, 21, 24, 27, 30, 33]\nice_creams = [120, 150, 210, 260, 320, 400]\nplt.scatter(temp, ice_creams, s=60, color=\"orange\")\nplt.xlabel(\"Temperature (°C)\")\nplt.ylabel(\"Ice creams sold\")\nplt.show()", "exercises": [{"id": "5a", "title": "Study time vs score", "task": "<p>Make a scatter plot with <code class='i'>hours<\/code> on x and <code class='i'>score<\/code> on y.<\/p>", "starter": "import matplotlib.pyplot as plt\n\nhours = [1, 3, 2, 5, 4, 6, 8, 7]\nscore = [50, 62, 58, 75, 68, 80, 92, 85]\n", "hint": "plt.scatter(hours, score)", "solution": "import matplotlib.pyplot as plt\n\nhours = [1, 3, 2, 5, 4, 6, 8, 7]\nscore = [50, 62, 58, 75, 68, 80, 92, 85]\nplt.scatter(hours, score)\nplt.show()", "check": "a = ax()\nexpect(len(a.collections) >= 1, \"Use plt.scatter to draw dots\")\npts = a.collections[0].get_offsets()\nexpect(same(pts[:, 0], hours) and same(pts[:, 1], score), \"Put hours on x and score on y\")"}, {"id": "5b", "title": "Bigger, see-through dots", "task": "<p>Draw the scatter with dot size 100, colour <code class='i'>purple<\/code>, and transparency 0.5.<\/p>", "starter": "import matplotlib.pyplot as plt\n\nx = [1, 2, 2.5, 3, 3.2, 4, 4.1, 5]\ny = [2, 3, 3.1, 4, 4.2, 5, 5.1, 6]\n", "hint": "plt.scatter(x, y, s=100, color=\"purple\", alpha=0.5)", "solution": "import matplotlib.pyplot as plt\n\nx = [1, 2, 2.5, 3, 3.2, 4, 4.1, 5]\ny = [2, 3, 3.1, 4, 4.2, 5, 5.1, 6]\nplt.scatter(x, y, s=100, color=\"purple\", alpha=0.5)\nplt.show()", "check": "c = ax().collections[0]\nexpect(near(c.get_sizes()[0], 100), \"Set the size with s=100\")\nexpect(near(c.get_alpha() if c.get_alpha() is not None else c.get_facecolor()[0][3], 0.5), \"Set the transparency with alpha=0.5\")\nfc = c.get_facecolor()[0]\nexpect(to_hex(fc[:3]) == to_hex(\"purple\"), \"Make the dots purple: color=\\\"purple\\\"\")"}, {"id": "5c", "title": "Colour by a third value", "task": "<p>Plot car <code class='i'>speed<\/code> (x) against <code class='i'>fuel<\/code> use (y). Colour each dot by the car’s <code class='i'>weight<\/code> using <code class='i'>c=<\/code>, and add a colour bar.<\/p>", "starter": "import matplotlib.pyplot as plt\n\nspeed = [60, 80, 100, 120, 70, 90, 110]\nfuel = [5.0, 5.8, 6.9, 8.2, 6.5, 7.4, 9.0]\nweight = [1100, 1150, 1200, 1250, 1600, 1700, 1800]\n", "hint": "plt.scatter(speed, fuel, c=weight), then plt.colorbar()", "solution": "import matplotlib.pyplot as plt\n\nspeed = [60, 80, 100, 120, 70, 90, 110]\nfuel = [5.0, 5.8, 6.9, 8.2, 6.5, 7.4, 9.0]\nweight = [1100, 1150, 1200, 1250, 1600, 1700, 1800]\nplt.scatter(speed, fuel, c=weight)\nplt.colorbar()\nplt.show()", "check": "a = ax()\nexpect(len(a.collections) >= 1, \"Use plt.scatter\")\narr = a.collections[0].get_array()\nexpect(arr is not None and same(arr, weight), \"Colour the dots by weight with c=weight\")\nexpect(len(fig().axes) == 2, \"Add the colour key with plt.colorbar()\")"}]}, {"id": "g6", "title": "Histograms", "blurb": "See how values are spread out.", "learn": [{"t": "<p>A <b>histogram<\/b> shows how values are <b>spread out<\/b>. It splits the range into equal slices called <b>bins<\/b>, then draws a bar for how many values fall into each bin.<\/p><p>Unlike a bar chart, you give it the raw values, and it does the counting for you.<\/p>", "code": "import matplotlib.pyplot as plt\n\nages = [22, 25, 27, 31, 33, 34, 35, 38, 41, 42, 44, 45, 48, 52, 58, 63]\nplt.hist(ages)\nplt.show()", "img": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAXMAAAD0CAYAAABpeMZGAAAAOnRFWHRTb2Z0d2FyZQBNYXRwbG90bGliIHZlcnNpb24zLjExLjIsIGh0dHBzOi8vbWF0cGxvdGxpYi5vcmcvgI3uAAAAAAlwSFlzAAALEwAACxMBAJqcGAAAFWtJREFUeJzt3W1QVOfdx/EfBHxOnFqIrQbwIbDqBCx28aERjRiLSWwEFFQ6bZJiMU4UNabGaWqTadVi2qltk9bOombUSDQkjVGxpmh0ZKrG7CSKRJRWRUQcCzFGIggI537h3W3IIrsqm9XL7+fVnr0ul/+ccb6eObuLAZZlWQIA3NYC/T0AAODmEXMAMAAxBwADEHMAMAAxBwADEHMAMECQP35oSEiI+vTp448fDQC3rbKyMlVXV7e65peY9+nTR06n0x8/GgBuW3a7/Zpr3GYBAA plt.hist the raw scores list\")"}, {"id": "6b", "title": "A thousand heights", "task": "<p>Make 1000 random heights with mean 170 and spread 8 using <code class='i'>rng.normal<\/code>. Store them in <code class='i'>heights<\/code>, and draw a histogram with 30 bins and white edges.<\/p>", "starter": "import numpy as np\nimport matplotlib.pyplot as plt\n\nrng = np.random.default_rng(0)\n", "hint": "heights = rng.normal(170, 8, 1000), then plt.hist(heights, bins=30, edgecolor=\"white\")", "solution": "import numpy as np\nimport matplotlib.pyplot as plt\n\nrng = np.random.default_rng(0)\nheights = rng.normal(170, 8, 1000)\nplt.hist(heights, bins=30, edgecolor=\"white\")\nplt.show()", "check": "expect(defined(\"heights\") and len(heights) == 1000, \"heights should have 1000 values\")\nexpect(160 < np.mean(heights) < 180, \"Use a mean of 170: rng.normal(170, 8, 1000)\")\nbars = ax().patches\nexpect(len(bars) == 30, \"Use 30 bins\")\nexpect(color_is(bars[0].get_edgecolor(), \"white\"), \"Add white edges: edgecolor=\\\"white\\\"\")"}, {"id": "6c", "title": "Mark the average", "task": "<p>Draw the histogram, then add a <b>vertical line<\/b> at the mean delivery time.<\/p>", "starter": "import numpy as np\nimport matplotlib.pyplot as plt\n\ntimes = np.array([18, 22, 25, 25, 27, 29, 30, 31, 33, 35, 38, 42, 47, 55])\n", "hint": "plt.hist(times), then plt.axvline(times.mean())", "solution": "import numpy as np\nimport matplotlib.pyplot as plt\n\ntimes = np.array([18, 22, 25, 25, 27, 29, 30, 31, 33, 35, 38, 42, 47, 55])\nplt.hist(times, edgecolor=\"white\")\nplt.axvline(times.mean(), color=\"red\", linestyle=\"--\")\nplt.show()", "check": "a = ax()\nexpect(len(a.patches) > 0, \"Draw the histogram with plt.hist(times)\")\nlines = a.get_lines()\nexpect(len(lines) >= 1, \"Add a vertical line with plt.axvline()\")\nxs = lines[-1].get_xdata()\nexpect(near(xs[0], times.mean()) and near(xs[-1], times.mean()), \"Put the line at the mean: plt.axvline(times.mean())\")"}]}, {"id": "g7", "title": "Figures & axes", "blurb": "Use the style professionals use, and put several charts together.", "learn": [{"t": "<p>So far, every <code class='i'>plt.something()<\/code> drew on “the current chart”. That’s quick, but once you have more than one chart, it gets confusing.<\/p><p>Most people write this instead: <code class='i'>fig, ax = plt.subplots()<\/code>. This gives you two things: <code class='i'>fig<\/code> is the whole picture (the canvas), and <code class='i'>ax<\/code> is one chart inside it. Then you draw on <code class='i'>ax<\/code> directly.<\/p>", "code": "import matplotlib.pyplot as plt\n\nfig, ax = plt.subplots()\nax.plot([1, 2, 3, 4], [10, 20, 15, 25])\nax.set_title(\"Sales\")\nax.set_xlabel(\"Week\")\nplt.show()", "img": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAXAAAAEVCAYAAAD5IL7WAAAAOnRFWHRTb2Z0d2FyZQBNYXRwbG90bGliIHZlcnNpb24zLjExLjIsIGh0dHBzOi8vbWF0cGxvdGxpYi5vcmcvgI3uAAAAAAlwSFlzAAALEwAACxMBAJqcGAAANcxJREFUeJzt3XlYVAX7xvEvMKwKLizuigruiMDgvpV7ZlpZ7mmZuKRWVpaaWm+ammWuqKS9Fe5puWaa5o5FAwiuuKLiBqKyrzPn94ev/CJIUYEzMzyf6+q6mjkzc+4Tzc3hPDPnWCiKoiCEEMLkWKodQAghxJORAhdCCBMlBS6EECZKClwIIUyUFLgQQpgoKXAhhDBRUuBCCGGipMCFEMJESYELs3L48GG6du1KrVq1aN26NevXry/U81q0aEFCQkIxpxOiaGnUDiBEUYmJiaFPnz7Mnj2bZ599lmPHjjF06FAqVqxIly5dHvrcqKgocnJySiipEEVDClyYjZCQEJo0acKbb74JQJ06dXB2dqZMmTIAZGRkEBQUxNGjR3FycmLChAnUr18/3+tkZWWxYMECQkND8fT05P3336dixYoAREdHs3DhQpKSkujevTuDBg0quQ0U4h/kEIowGy1atCA8PJw5c+YQHx8PQIcOHdBqtQAEBASwY8cO+vfvT6VKlejUqRMFnQqob9++nDhxgoCAADIzM+nUqRM5OTlkZWXRvn17qlWrxuDBg1myZAkbN24s0W0UIg9FCDNy/vx5ZfDgwYqDg4PSsWNHZdu2bbnLMjIylIyMDEVRFCUxMVFxcHBQzp49qyiKotjZ2Sk3b95Ujh8/rri4uOQ+zmAwKLVr11b279+v3Lt3T3FwcFCioqIURVGUzMzMEt46IfKSPXBhVurWrUtwcDC3b9/mjTfeYMyYMbmDzMjISMaMGUP9+vVp2bIlFhYWpKWl5Xn+6dOnSU5OxsPDgxo1alCzZk1u3rzJ2bNnKVeuHAsXLqRHjx74+fkRGBhIenq6GpspBCCHUIQZCQ0NJSwsDAB7e3uGDBnC+PHj2blzJ3q9nu7du6PVaomMjOTUqVM4OTnlew0XFxeaNWvG1atXc/9JS0tjxIgRAAwfPpzLly+zdOlStmzZwmeffVai2yjE30mBC7Nx6tQp+vXrx7FjxzAYDISFhbF69Wq0Wi05OTmkpqbSqlUrNBoNQUFB3LhxI99rtGzZkps3b/L ors)\nax.set_title(\"Visitors\")\nplt.show()", "check": "expect(\"subplots\" in __code__ and \"ax.\" in __code__, \"Use fig, ax = plt.subplots() and draw with ax.plot()\")\na = ax()\nexpect(len(a.get_lines()) == 1 and same(a.get_lines()[0].get_ydata(), visitors), \"Plot visitors against weeks\")\nexpect(a.get_title() == \"Visitors\", \"Set the title with ax.set_title(\\\"Visitors\\\")\")"}, {"id": "7b", "title": "Side by side", "task": "<p>Make two charts side by side. On the <b>left<\/b>, a line chart of <code class='i'>temps<\/code>. On the <b>right<\/b>, a bar chart of <code class='i'>rain<\/code>. Use <code class='i'>days<\/code> for x in both.<\/p>", "starter": "import matplotlib.pyplot as plt\n\ndays = [\"Mon\", \"Tue\", \"Wed\", \"Thu\", \"Fri\"]\ntemps = [21, 23, 19, 18, 24]\nrain = [0, 2, 8, 12, 1]\n", "hint": "fig, axes = plt.subplots(1, 2), then axes[0].plot(days, temps) and axes[1].bar(days, rain)", "solution": "import matplotlib.pyplot as plt\n\ndays = [\"Mon\", \"Tue\", \"Wed\", \"Thu\", \"Fri\"]\ntemps = [21, 23, 19, 18, 24]\nrain = [0, 2, 8, 12, 1]\nfig, axes = plt.subplots(1, 2, figsize=(9, 3.5))\naxes[0].plot(days, temps)\naxes[1].bar(days, rain)\nplt.show()", "check": "f = fig()\nexpect(len(f.axes) == 2, \"Make 2 charts with plt.subplots(1, 2)\")\nleft, right = f.axes[0], f.axes[1]\nexpect(len(left.get_lines()) == 1 and same(left.get_lines()[0].get_ydata(), temps), \"The left chart should be a line of temps\")\nexpect(len(right.patches) == 5 and same([b.get_height() for b in right.patches], rain), \"The right chart should be bars of rain\")"}, {"id": "7c", "title": "Size and a main title", "task": "<p>Make the figure 8 inches wide and 3 tall, with 1 row and 2 columns. Add the main title <code class='i'>Weekly report<\/code> above both charts.<\/p>", "starter": "import matplotlib.pyplot as plt\n\n# make the figure here\n\naxes[0].plot([1, 2, 3, 4, 5], [5, 7, 6, 8, 9])\naxes[1].bar([\"A\", \"B\", \"C\"], [4, 6, 3])\n\nplt.tight_layout()\nplt.show()", "hint": "fig, axes = plt.subplots(1, 2, figsize=(8, 3)), and fig.suptitle(\"Weekly report\")", "solution": "import matplotlib.pyplot as plt\n\nfig, axes = plt.subplots(1, 2, figsize=(8, 3))\naxes[0].plot([1, 2, 3, 4, 5], [5, 7, 6, 8, 9])\naxes[1].bar([\"A\", \"B\", \"C\"], [4, 6, 3])\nfig.suptitle(\"Weekly report\")\nplt.tight_layout()\nplt.show()", "check": "f = fig()\nw, h = f.get_size_inches()\nexpect(near(w, 8) and near(h, 3), \"Set the size with figsize=(8, 3)\")\nexpect(len(f.axes) == 2, \"Use 1 row and 2 columns\")\nst = getattr(f, \"_suptitle\", None)\nexpect(st is not None and st.get_text() == \"Weekly report\", \"Add the main title with fig.suptitle(\\\"Weekly report\\\")\")"}]}, {"id": "g8", "title": "Charts from pandas", "blurb": "Plot tables directly, then build a small dashboard.", "learn": [{"t": "<p>pandas tables can draw themselves. <code class='i'>df.plot(x=\"col\", y=\"col\")<\/code> makes a line chart, using Matplotlib behind the scenes. Column names become axis labels and the legend automatically.<\/p><p class='tip'>The first chart in this lesson takes a few extra seconds, because pandas has to load.<\/p>", "code": "import pandas as pd\nimport matplotlib.pyplot as plt\n\ndf = pd.DataFrame({\"month\": [\"Jan\", \"Feb\", \"Mar\", \"Apr\"], \"visitors\": [120, 150, 135, 190]})\ndf.plot(x=\"month\", y=\"visitors\")\nplt.show()", "img": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAXUAAAEECAYAAADXg6SsAAAAOnRFWHRTb2Z0d2FyZQBNYXRwbG90bGliIHZlcnNpb24zLjExLjIsIGh0dHBzOi8vbWF0cGxvdGxpYi5vcmcvgI3uAAAAAAlwSFlzAAALEwAACxMBAJqcGAAANTpJREFUeJzt3Xl4Tdf+x/F35kkGMpJBxBwZkCMxlVItqlTNQ6lWRQ1Flbo63c6lqGrrtkVLETHEVFXaUvMUJyQREpEQGZBRkHnavz9c51eXGpOck5Pv63k8j+yzz97fHfLJOmuvvZaBoigKQggh9IKhtgsQQghReSTUhRBCj0ioCyGEHpFQF0IIPSKhLoQQekRCXQgh9IixNk/u4OCAp6enNksQQogaJykpiaysrLu+ptVQ9/T0RK1Wa7MEIYSocVQq1T++Jt0vQgihRyTUhRBCj0ioCyGEHtFqn/rdlJaWkpqaSlFRkbZL0Rnm5ua4ublhYmKi7VKEEDrukUNdURQMDAweePuDSk1NxdraGk9Pz8c6jr5QFIXs7GxSU1Np1KiRtssRQui4+3a/HDt2DG9vb8aPHw9AcnIyXbp0oXHjxgQF /* ---------- Python engine (Pyodide: real Python + NumPy in the browser) ---------- */
let engine = "loading";
let py = null;
const BRIDGE = `
import os
os.environ["MPLBACKEND"] = "Agg"
import io, json, contextlib, base64
import matplotlib
matplotlib.use("Agg")
import matplotlib.pyplot as plt
plt.rcParams["figure.figsize"] = (6, 3.8)
plt.show = lambda *a, **k: None

def _images():
    out = []
    for n in plt.get_fignums():
        b = io.BytesIO()
        plt.figure(n).savefig(b, format="png", dpi=90, bbox_inches="tight")
        out.append("data:image/png;base64," + base64.b64encode(b.getvalue()).decode())
    return out

def _run(code, check):
    plt.close("all")
    buf = io.StringIO()
    ns = {"__name__": "__main__"}
    err = ""
    try:
        compiled = compile(code, "<your code>", "exec")
        with contextlib.redirect_stdout(buf), contextlib.redirect_stderr(buf):
            exec(compiled, ns)
    except SyntaxError as e:
        err = type(e).__name__ + (" on line " + str(e.lineno) if e.lineno else "") + ": " + str(e.msg)
    except Exception as e:
        line = None
        tb = e.__traceback__
        while tb is not None:
            if tb.tb_frame.f_code.co_filename == "<your code>":
                line = tb.tb_lineno
            tb = tb.tb_next
        err = type(e).__name__ + (" on line " + str(line) if line else "") + ": " + str(e)
    text = buf.getvalue()
    ok = False
    msg = ""
    if not err and check:
        ns["__output__"] = text
        ns["__code__"] = code
        try:
            with contextlib.redirect_stdout(io.StringIO()), contextlib.redirect_stderr(io.StringIO()):
                exec(check, ns)
            ok = True
        except AssertionError as e:
            msg = str(e)
        except Exception as e:
            msg = "While testing your chart: " + type(e).__name__ + ": " + str(e)
    imgs = []
    try:
        imgs = _images()
    except Exception as e:
        if not err:
            err = "Couldn’t draw the chart: " + type(e).__name__ + ": " + str(e)
    plt.close("all")
    return json.dumps({"ok": ok, "out": text, "err": err, "msg": msg, "imgs": imgs})
`;
function setEngine(kind, detail) {
  engine = kind;
  const dot = document.getElementById("engine-dot");
  const txt = document.getElementById("engine-text");
  dot.className = "dot" + (kind === "ready" ? " ok" : kind === "none" ? " bad" : "");
  txt.textContent = kind === "ready" ? "Python and Matplotlib are ready"
    : kind === "none" ? "Python couldn’t start" + (detail ? " (" + detail + ")" : "") + ". Check your internet connection and reload."
    : kind === "numpy" ? "Loading Matplotlib… (this is the slow part)"
    : "Starting Python… (the first time takes 10–20 seconds)";
}
async function initPy() {
  setTimeout(() => { if (engine !== "ready" && engine !== "none") setEngine("none", "took longer than 90 seconds"); }, 90000);
  try {
    if (typeof loadPyodide !== "function") throw new Error("Pyodide script not loaded");
    py = await loadPyodide({ indexURL: "https://cdn.jsdelivr.net/pyodide/v0.27.7/full/" });
    setEngine("numpy");
    await py.loadPackage(["numpy", "matplotlib"]);
    py.runPython(BRIDGE);
    if (engine !== "none") setEngine("ready"); else setEngine("ready");
  } catch (e) {
    console.error(e);
    setEngine("none", String((e && e.message) || e).slice(0, 140));
  }
}
async function runPython(code, check) {
  if (engine !== "ready") return { ok: false, out: "", err: "", msg: "Python is still starting. Wait a few seconds and try again." };
  await new Promise(r => setTimeout(r, 30));
  try { await py.loadPackagesFromImports(code); } catch (e) {}
  try {
    const fn = py.globals.get("_run");
    const raw = fn(code, check ? PRELUDE + "\n" + check : "");
    fn.destroy();
    return JSON.parse(raw);
  } catch (e) {
    return { ok: false, out: "", err: "Something went wrong running your code: " + e.message, msg: "" };
  }
}

const FRIENDLY = {
  NameError: "Python doesn’t know this name. Check the spelling, or create the variable before using it.",
  TypeError: "You mixed types that don’t go together, like text + number. Convert with int(), float() or str().",
  IndexError: "That list position doesn’t exist. Positions start at 0, and the last one is -1.",
  ValueError: "The type is right but the value isn’t, like int(\"abc\").",
  ZeroDivisionError: "You divided by zero, which isn’t possible.",
  SyntaxError: "Python can’t read this line. Look for a missing colon, bracket, or quote.",
  IndentationError: "The spaces at the start of a line are wrong. Lines inside if, for, while and def need 4 spaces.",
  KeyError: "That key isn’t in the dictionary. Check the spelling and capital letters.",
  AttributeError: "This value doesn’t have that tool. Check the spelling after the dot.",
  ModuleNotFoundError: "That library isn’t available here. This course has Matplotlib, NumPy and pandas."
};
function friendlyFor(err) {
  if (/could not be broadcast/.test(err)) return "Your arrays have different sizes, so NumPy can’t pair them up. Check each one’s .shape.";
  if (/truth value of an array/.test(err)) return "Use & and | (with brackets around each rule) instead of and / or when working with arrays.";
  if (/cannot reshape/.test(err)) return "The new shape needs the same total number of items. Rows × columns must equal the array’s size.";
  if (/must have same first dimension/.test(err)) return "Your x and y lists have different lengths. They must have the same number of values.";
  if (/name 'plt' is not defined/.test(err)) return "Add import matplotlib.pyplot as plt at the top of your code.";
  if (/name 'pd' is not defined/.test(err)) return "Add import pandas as pd at the top of your code.";
  if (/name 'io' is not defined/.test(err)) return "Add import io at the top of your code.";
  if (/^KeyError/.test(err)) return "pandas can’t find that column or row name. Check the spelling and capital letters, and print(df.columns) to see the real names.";
  if (/name 'np' is not defined/.test(err)) return "Add import numpy as np at the top of your code.";
  if (/too many indices/.test(err)) return "You used more positions than the array has dimensions. A 1D array only needs one number in the brackets.";
  const name = (err.match(/^(\w+)/) || [])[1];
  return FRIENDLY[name] || "Read the error name above. It tells you what kind of problem it is.";
}

/* ---------- Editor ---------- */
function makeEditor(value, onChange, onSubmit) {
  const ta = document.createElement("textarea");
  ta.className = "code"; ta.spellcheck = false; ta.autocapitalize = "off"; ta.autocomplete = "off";
  ta.setAttribute("autocorrect", "off");
  ta.setAttribute("aria-label", "Code editor");
  ta.value = value;
  const fit = () => { ta.style.height = "auto"; ta.style.height = Math.max(140, ta.scrollHeight + 4) + "px"; };
  ta.addEventListener("input", () => { onChange && onChange(ta.value); fit(); });
  ta.addEventListener("keydown", e => {
    if ((e.ctrlKey || e.metaKey) && e.key === "Enter") { e.preventDefault(); onSubmit && onSubmit(); return; }
    if (e.key === "Tab" && !e.shiftKey) {
      e.preventDefault();
      const s = ta.selectionStart, en = ta.selectionEnd;
      ta.value = ta.value.slice(0, s) + "    " + ta.value.slice(en);
      ta.selectionStart = ta.selectionEnd = s + 4;
      onChange && onChange(ta.value); fit();
    } else if (e.key === "Enter") {
      const s = ta.selectionStart;
      const lineStart = ta.value.lastIndexOf("\n", s - 1) + 1;
      const line = ta.value.slice(lineStart, s);
      let indent = (line.match(/^ */) || [""])[0];
      if (/:\s*$/.test(line)) indent += "    ";
      if (indent) {
        e.preventDefault();
        ta.value = ta.value.slice(0, s) + "\n" + indent + ta.value.slice(ta.selectionEnd);
        ta.selectionStart = ta.selectionEnd = s + 1 + indent.length;
        onChange && onChange(ta.value); fit();
      }
    }
  });
  requestAnimationFrame(fit);
  return ta;
}

function makeConsole() {
  const con = document.createElement("div");
  con.className = "console";
  con.innerHTML = `<div class="console-head">Output</div><pre aria-live="polite">Press Run to see your chart.</pre><div class="plots"></div><div class="verdict" hidden></div>`;
  return con;
}

function showResult(con, res, isCheck) {
  con.className = "console";
  const head = con.querySelector(".console-head");
  const pre = con.querySelector("pre");
  const verdict = con.querySelector(".verdict");
  pre.textContent = "";
  if (res.out) pre.append(document.createTextNode(res.out));
  if (res.err) {
    const s = document.createElement("span"); s.className = "err-line";
    s.textContent = (res.out && !res.out.endsWith("\n") ? "\n" : "") + res.err;
    pre.append(s);
  }
  const plots = con.querySelector(".plots");
  plots.innerHTML = "";
  (res.imgs || []).forEach(src => { const im = document.createElement("img"); im.src = src; im.alt = "Your chart"; plots.appendChild(im); });
  pre.hidden = !res.out && !res.err && (res.imgs || []).length > 0;
  if (!res.out && !res.err && !isCheck && !res.msg && !(res.imgs || []).length) pre.textContent = "(your code ran, but there’s no chart. Did you call a plot function?)";
  verdict.hidden = true; verdict.className = "verdict";
  if (res.err) {
    head.textContent = "Error";
    con.classList.add("fail");
    verdict.hidden = false; verdict.classList.add("fail");
    verdict.textContent = friendlyFor(res.err);
  } else if (isCheck) {
    head.textContent = res.ok ? "Correct" : "Not yet";
    con.classList.add(res.ok ? "pass" : "fail");
    verdict.hidden = false; verdict.classList.add(res.ok ? "pass" : "fail");
    verdict.textContent = res.ok ? "Well done. Exercise solved." : (res.msg || "Not quite. Compare your output with the task.");
  } else {
    head.textContent = "Output";
    if (res.msg) { verdict.hidden = false; verdict.textContent = res.msg; }
  }
}

  let pgCode = m.playground;
  const pgWrap = document.createElement("div"); pgWrap.className = "editor-wrap";
  const pgBar = document.createElement("div"); pgBar.className = "editor-bar"; pgBar.innerHTML = "<span>Playground</span><span>Nothing here is graded</span>";
  const pgCon = makeConsole();
  const runPg = async () => { const p = pgCon.querySelector("pre"); p.hidden = false; p.textContent = "Running…"; showResult(pgCon, await runPython(pgCode, ""), false); };
  const pgTa = makeEditor(pgCode, v => pgCode = v, runPg);
  pgWrap.append(pgBar, pgTa);
  const pgActions = document.createElement("div"); pgActions.className = "actions";
  const pgRun = document.createElement("button"); pgRun.className = "btn"; pgRun.textContent = "Run";
  pgRun.addEventListener("click", runPg);
  pgActions.appendChild(pgRun);
  body.append(tryHead, pgWrap, pgActions, pgCon);
  det.append(sum, body); main.appendChild(det);

  // Exercise
  if (state.ex >= m.exercises.length) state.ex = 0;
  const ex = m.exercises[state.ex];

  const nav = document.createElement("div"); nav.className = "ex-nav";
  const steps = document.createElement("div"); steps.className = "steps";
  m.exercises.forEach((x, i) => {
    const b = document.createElement("button"); b.className = "step" + (state.done[x.id] ? " done" : "");
    b.textContent = state.done[x.id] ? "✓" : String(i + 1);
    b.setAttribute("aria-label", `Exercise ${i + 1}${state.done[x.id] ? ", solved" : ""}`);
    b.setAttribute("aria-current", i === state.ex ? "true" : "false");
    b.addEventListener("click", () => { state.ex = i; save(); render(); });
    steps.appendChild(b);
  });
  const t = document.createElement("h2"); t.className = "ex-title"; t.textContent = `Exercise: ${ex.title}`;
  nav.append(steps, t); main.appendChild(nav);

  const task = document.createElement("div"); task.className = "task"; task.innerHTML = ex.task;
  main.appendChild(task);

  let code = state.code[ex.id] != null ? state.code[ex.id] : ex.starter;
  const wrap = document.createElement("div"); wrap.className = "editor-wrap";
  const bar = document.createElement("div"); bar.className = "editor-bar";
  bar.innerHTML = "<span>Your code</span><span>Ctrl/⌘ + Enter to check</span>";
  const con = makeConsole();
  const helper = document.createElement("div"); helper.className = "helper"; helper.hidden = true;

  const actions = document.createElement("div"); actions.className = "actions";
  const runBtn = document.createElement("button"); runBtn.className = "btn"; runBtn.textContent = "Run";
  const checkBtn = document.createElement("button"); checkBtn.className = "btn primary"; checkBtn.textContent = "Check answer";
  const hintBtn = document.createElement("button"); hintBtn.className = "btn"; hintBtn.textContent = "Hint";
  const solBtn = document.createElement("button"); solBtn.className = "btn"; solBtn.textContent = "Solution";
  const resetBtn = document.createElement("button"); resetBtn.className = "btn ghost"; resetBtn.textContent = "Reset code";

  const nextRow = document.createElement("div"); nextRow.className = "next-row";
  const prevBtn = document.createElement("button"); prevBtn.className = "btn"; prevBtn.textContent = "Previous";
  const nextBtn = document.createElement("button");
  const isLastEx = state.ex === m.exercises.length - 1;
  const isLastMod = state.mod === MODULES.length - 1;
  nextBtn.className = "btn" + (state.done[ex.id] ? " primary" : "");
  nextBtn.textContent = isLastEx ? (isLastMod ? "Back to start" : "Next lesson") : "Next exercise";
  prevBtn.disabled = state.mod === 0 && state.ex === 0;

  const doRun = async () => {
    con.querySelector("pre").hidden = false; con.querySelector("pre").textContent = "Running…";
    showResult(con, await runPython(code, ""), false);
  };
  const doCheck = async () => {
    checkBtn.disabled = true;
    con.querySelector("pre").hidden = false; con.querySelector("pre").textContent = "Checking…";
    const res = await runPython(code, ex.check);
    checkBtn.disabled = false;
    showResult(con, res, true);
    if (res.ok) {
      nextBtn.classList.add("primary");
      if (!state.done[ex.id]) {
        state.done[ex.id] = true; save(); renderSidebar(); renderProgress();
        const b = steps.children[state.ex]; b.classList.add("done"); b.textContent = "✓";
        if (doneCount() === TOTAL) showFinish();
      }
    }
  };
  const ta = makeEditor(code, v => { code = v; state.code[ex.id] = v; save(); }, doCheck);
  wrap.append(bar, ta); main.appendChild(wrap);

  runBtn.addEventListener("click", doRun);
  checkBtn.addEventListener("click", doCheck);
  hintBtn.addEventListener("click", () => {
    helper.hidden = false; helper.innerHTML = "<h3>Hint</h3>";
    const p = document.createElement("p"); p.textContent = ex.hint; helper.appendChild(p);
  });
  solBtn.addEventListener("click", () => {
    helper.hidden = false;
    helper.innerHTML = "<h3>Solution</h3><p>Read it, understand each line, then type it yourself instead of copying. That’s how it sticks.</p>";
    const pre = document.createElement("pre"); pre.textContent = ex.solution; helper.appendChild(pre);
  });
  resetBtn.addEventListener("click", () => {
    code = ex.starter; ta.value = code; delete state.code[ex.id]; save(); ta.dispatchEvent(new Event("input"));
  });
  actions.append(runBtn, checkBtn, hintBtn, solBtn, resetBtn);
  main.append(actions, con, helper);

  prevBtn.addEventListener("click", () => {
    if (state.ex > 0) state.ex--; else { state.mod--; state.ex = MODULES[state.mod].exercises.length - 1; }
    save(); render(); window.scrollTo(0, 0);
  });
  nextBtn.addEventListener("click", () => {
    if (!isLastEx) state.ex++;
    else if (isLastMod) { state.mod = 0; state.ex = 0; }
    else { state.mod++; state.ex = 0; }
    save(); render(); window.scrollTo(0, 0);
  });
  nextRow.append(prevBtn, nextBtn);
  main.appendChild(nextRow);

  function showFinish() {
    const f = document.createElement("div"); f.className = "finish";
    f.innerHTML = "<h2>You finished every exercise</h2><p>You can now draw line, bar, scatter and histogram charts, label and style them, combine several into one figure, and plot straight from pandas. That’s everything you need to show your data clearly.</p>";
    main.appendChild(f);
  }
  if (doneCount() === TOTAL) showFinish();
}

document.getElementById("reset").addEventListener("click", () => {
  if (!confirm("Erase all progress and saved code?")) return;
  state = { done: {}, code: {}, mod: 0, ex: 0 }; save(); render();
});

if (state.mod >= MODULES.length) state.mod = 0;
render();
setEngine("loading");
initPy();
</script>

</body>
</html>
